plugins { id 'com.android.application' }
android {
    namespace 'app.studyflow.android'
    compileSdk 35
    defaultConfig {
        applicationId 'app.studyflow.android'
        minSdk 24
        targetSdk 35
        // Every GitHub build gets a higher number, so phones can install updates over the old app.
        versionCode((System.getenv('BUILD_NUMBER') ?: '1').toInteger())
        versionName '1.' + (System.getenv('BUILD_NUMBER') ?: '0')
    }
    signingConfigs {
        release {
            // The signing key is never stored in the public repository. GitHub puts it here from a secret during the build.
            storeFile file(System.getenv('KS_FILE') ?: 'studyflow.keystore')
            storePassword System.getenv('KS_PASS') ?: ''
            keyAlias System.getenv('KS_ALIAS') ?: 'studyflow'
            keyPassword System.getenv('KS_PASS') ?: ''
        }
    }
    buildTypes {
        // UNSIGNED=1: GitHub builds without the key; the owner signs it on their own computer so the key never leaves it.
        release { minifyEnabled false; signingConfig(System.getenv('UNSIGNED') ? null : signingConfigs.release) }
        debug { signingConfig signingConfigs.release }
    }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
