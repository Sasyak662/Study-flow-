name: Build Android app

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Add the private signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::The KEYSTORE_B64 secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build the APK
        env:
          KS_FILE: ${{ runner.temp }}/release.keystore
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Put StudyFlow.apk on the website
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk StudyFlow.apk
          git config user.name "StudyFlow bot"
          git config user.email "actions@users.noreply.github.com"
          git add StudyFlow.apk
          git commit -m "Update StudyFlow Android app" || echo "No change"
          git pull --rebase
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-android
          path: StudyFlow.apk
