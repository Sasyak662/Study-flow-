name: Focus lock test on an Android emulator

on:
  push:
    paths:
      - '.github/workflows/lock-test.yml'
      - '.github/scripts/locktest.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build and sign with a throwaway test key
        env: { UNSIGNED: '1', BUILD_NUMBER: '999' }
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          gradle -p android assembleRelease --no-daemon -q
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          keytool -genkeypair -keystore t.jks -storepass testtest -keypass testtest -alias t -keyalg RSA -keysize 2048 -validity 2 -dname "CN=test"
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f -p 4 $(ls android/app/build/outputs/apk/release/*.apk | head -1) aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks t.jks --ks-pass pass:testtest --key-pass pass:testtest --out test.apk aligned.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/locktest.sh
      - name: Save the screenshots on the lock-test branch
        if: always()
        run: |
          cd shots && git init -q && git config user.name bot && git config user.email bot@users.noreply.github.com
          git checkout -q -b lock-test-${{ matrix.api }} && git add . && git commit -q -m "lock test ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" lock-test-${{ matrix.api }}
